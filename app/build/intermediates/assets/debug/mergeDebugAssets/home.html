<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>VidSrc</title>
<style>
  :root { --bg:#0e1621; --panel:#18263a; --text:#e8eef6; --dim:#8a9bb3; --accent:#f7c55c; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; }
  body { padding:40px 56px 80px; }
  h2 { font-size:22px; color:var(--dim); font-weight:600; margin:36px 0 16px; }
  .top { display:flex; align-items:center; gap:20px; }
  .logo { height:44px; }
  #q { flex:1; font-size:26px; padding:16px 22px; border-radius:12px; border:3px solid transparent;
       background:var(--panel); color:var(--text); outline:none; }
  #q::placeholder { color:var(--dim); }
  .grid { display:grid; grid-template-columns:repeat(6, 1fr); gap:22px; }
  .card { background:var(--panel); border-radius:12px; overflow:hidden; border:3px solid transparent;
          transition:transform .12s, border-color .12s; }
  .card img, .card .noimg { width:100%; aspect-ratio:2/3; object-fit:cover; display:block; background:#223349; }
  .card .meta { padding:10px 12px 12px; }
  .card .t { font-size:16px; font-weight:600; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2;
             -webkit-box-orient:vertical; overflow:hidden; }
  .card .s { font-size:13px; color:var(--dim); margin-top:4px; }
  .focus, #q.focus { border-color:var(--accent); }
  .card.focus { transform:scale(1.06); }
  .msg { color:var(--dim); font-size:20px; padding:20px 0; }

  .show-head { display:flex; gap:32px; align-items:flex-start; }
  .show-head img { width:200px; border-radius:12px; }
  .show-head h1 { margin:0 0 10px; font-size:38px; }
  .show-head p { color:var(--dim); font-size:17px; line-height:1.5; max-width:820px; margin:0; }
  .seasons { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
  .pill { padding:10px 20px; border-radius:999px; background:var(--panel); font-size:18px; border:3px solid transparent; }
  .pill.on { background:var(--accent); color:#111; }
  .eps { display:grid; grid-template-columns:repeat(4, 1fr); gap:20px; margin-top:24px; }
  .ep { background:var(--panel); border-radius:12px; overflow:hidden; border:3px solid transparent; transition:transform .12s; }
  .ep.focus { transform:scale(1.04); }
  .ep img, .ep .noimg { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#223349; }
  .ep .meta { padding:10px 12px; }
  .ep .n { color:var(--accent); font-size:14px; font-weight:700; }
  .ep .t { font-size:16px; margin-top:2px; }
  .ep.last .n::after { content:"  ·  last watched"; color:var(--dim); font-weight:400; }
  /* Selected item: yellow outline + glow, lifted, everything else in its row dimmed. Last so it wins. */
  .card, .ep, .pill { transition:transform .12s, opacity .12s, box-shadow .12s; }
  .card.focus, .ep.focus, .pill.focus { border-color:var(--accent); opacity:1;
    box-shadow:0 0 0 3px var(--accent), 0 0 28px rgba(247,197,92,.55); position:relative; z-index:1; }
  .card.focus, .ep.focus { transform:scale(1.08); }
  .pill.focus { transform:scale(1.1); }
  .grid:has(.focus) .card:not(.focus), .eps:has(.focus) .ep:not(.focus) { opacity:.55; }
  .ep.focus .t, .card.focus .t { color:#fff; }
  .hint { position:fixed; bottom:16px; right:24px; color:var(--dim); font-size:14px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">MENU = home · BACK = back</div>
<script>
// ---------- native fetch (IMDb has no CORS headers) ----------
let cbSeq = 0; const cbs = {};
window.__nativeCb = (id, ok, body) => { const c = cbs[id]; delete cbs[id]; c && (ok ? c.res(body) : c.rej(new Error(body))); };
function get(url) {
  return new Promise((res, rej) => {
    if (!window.Native) return fetch(url).then(r => r.text()).then(res, rej); // desktop browser testing
    const id = ++cbSeq; cbs[id] = { res, rej }; Native.get(url, id);
  }).then(JSON.parse);
}

// ---------- data ----------
const KINDS = { movie:'Movie', tvMovie:'TV Movie', tvSeries:'Series', tvMiniSeries:'Mini-series', tvSpecial:'Special', video:'Video' };
const isSeries = k => k === 'tvSeries' || k === 'tvMiniSeries';
const poster = (u, w) => u ? u.replace(/(\._V1_.*)?\.jpg$/, `._V1_UX${w}_.jpg`) : '';

async function search(q) {
  const first = /[a-z0-9]/i.test(q[0]) ? q[0].toLowerCase() : 'x';
  const d = await get(`https://v3.sg.media-imdb.com/suggestion/${first}/${encodeURIComponent(q.toLowerCase())}.json`);
  return (d.d || []).filter(x => x.id?.startsWith('tt') && KINDS[x.qid]).map(x => ({
    id: x.id, title: x.l, year: x.y, kind: x.qid, img: poster(x.i?.imageUrl, 300), cast: x.s,
  }));
}

const store = {
  get recents() { try { return JSON.parse(localStorage.recents || '[]'); } catch { return []; } },
  save(item) {
    try {
      const r = this.recents.filter(x => x.id !== item.id);
      r.unshift(item); localStorage.recents = JSON.stringify(r.slice(0, 24));
    } catch {}
  },
};

function play(item, s, e) {
  store.save({ id:item.id, title:item.title, year:item.year, kind:item.kind, img:item.img, s, e });
  location.href = isSeries(item.kind)
    ? (s ? `https://vidsrc.to/embed/tv/${item.id}/${s}/${e}` : `https://vidsrc.to/embed/tv/${item.id}`)
    : `https://vidsrc.to/embed/movie/${item.id}`;
}

// ---------- views ----------
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
let current = {}; // item lookup for the rendered cards

function cardHtml(it) {
  current[it.id] = it;
  const sub = [KINDS[it.kind], it.year, it.s ? `S${it.s} E${it.e}` : ''].filter(Boolean).join(' · ');
  return `<div class="card" data-nav data-id="${it.id}">
    ${it.img ? `<img src="${esc(it.img)}" loading="lazy">` : '<div class="noimg"></div>'}
    <div class="meta"><div class="t">${esc(it.title)}</div><div class="s">${esc(sub)}</div></div></div>`;
}

let searchTimer, searchSeq = 0;
function renderHome(q = '') {
  current = {};
  app.innerHTML = `
    <div class="top"><img class="logo" src="logo.png" alt="VidSrc">
      <input id="q" data-nav placeholder="Search movies & shows…" value="${esc(q)}" autocomplete="off" enterkeyhint="search"></div>
    <div id="results"></div>`;
  const input = document.getElementById('q');
  input.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => runSearch(input.value), 300); });
  runSearch(q, true);
}

async function runSearch(q, initial) {
  q = q.trim();
  history.replaceState({ view:'home', q }, '', '#');
  const box = document.getElementById('results');
  if (!q) {
    const r = store.recents;
    box.innerHTML = r.length ? `<h2>Continue watching</h2><div class="grid">${r.map(cardHtml).join('')}</div>`
                             : `<div class="msg">Press OK on the search bar to type a title.</div>`;
    if (initial) focus(document.querySelector('.card') || document.getElementById('q'));
    return;
  }
  const seq = ++searchSeq;
  try {
    const res = await search(q);
    if (seq !== searchSeq) return;
    box.innerHTML = res.length ? `<h2>Results</h2><div class="grid">${res.map(cardHtml).join('')}</div>`
                               : `<div class="msg">Nothing found for “${esc(q)}”.</div>`;
  } catch (err) {
    if (seq === searchSeq) box.innerHTML = `<div class="msg">Search failed: ${esc(err.message)}</div>`;
  }
  if (initial) focus(document.querySelector('.card') || document.getElementById('q'));
}

async function renderShow(item, season) {
  current = {};
  app.innerHTML = `<div class="msg">Loading ${esc(item.title)}…</div>`;
  let meta;
  try { meta = (await get(`https://v3-cinemeta.strem.io/meta/series/${item.id}.json`)).meta; } catch {}
  const eps = (meta?.videos || []).filter(v => v.season > 0 && v.episode > 0)
    .sort((a, b) => a.season - b.season || a.episode - b.episode);
  if (!eps.length) { play(item); return; } // no episode data: fall back to vidsrc's own picker

  const seasons = [...new Set(eps.map(v => v.season))];
  const last = store.recents.find(x => x.id === item.id);
  season = season || last?.s || seasons[0];
  const list = eps.filter(v => v.season === season);

  app.innerHTML = `
    <div class="show-head">
      ${item.img ? `<img src="${esc(item.img)}">` : ''}
      <div><h1>${esc(item.title)}</h1><p>${esc(meta.description || '')}</p></div>
    </div>
    <div class="seasons">${seasons.map(s => `<div class="pill ${s === season ? 'on' : ''}" data-nav data-season="${s}">Season ${s}</div>`).join('')}</div>
    <div class="eps">${list.map(v => `
      <div class="ep ${last?.s === v.season && last?.e === v.episode ? 'last' : ''}" data-nav data-s="${v.season}" data-e="${v.episode}">
        ${v.thumbnail ? `<img src="${esc(v.thumbnail)}" loading="lazy" onerror="this.outerHTML='<div class=noimg></div>'">` : '<div class="noimg"></div>'}
        <div class="meta"><div class="n">E${v.episode}</div><div class="t">${esc(v.name || 'Episode ' + v.episode)}</div></div>
      </div>`).join('')}</div>`;

  app.onclick = ev => {
    const p = ev.target.closest('[data-season]');
    if (p) { renderShow(item, +p.dataset.season).then(() => focus(document.querySelector('.pill.on'))); return; }
    const ep = ev.target.closest('[data-e]');
    if (ep) play(item, +ep.dataset.s, +ep.dataset.e);
  };
  focus(document.querySelector('.ep.last') || document.querySelector('.ep'));
}

function openItem(it) {
  if (isSeries(it.kind)) {
    history.pushState({ view:'show', item:it }, '', '#show');
    renderShow(it);
  } else play(it);
}

app.addEventListener('click', ev => {
  const c = ev.target.closest('.card');
  if (c && current[c.dataset.id]) openItem(current[c.dataset.id]);
});

// Back from the show page (or from the player) lands here
window.addEventListener('popstate', ev => route(ev.state));
function route(st) {
  app.onclick = null;
  if (st?.view === 'show') renderShow(st.item);
  else renderHome(st?.q || '');
}

// ---------- D-pad spatial navigation ----------
let focused = null;
function focus(el) {
  if (!el) return;
  focused?.classList.remove('focus');
  focused = el; el.classList.add('focus');
  if (el.tagName === 'INPUT') el.focus({ preventScroll:true }); else document.activeElement?.blur();
  el.scrollIntoView({ block:'center', behavior:'smooth' });
}

function move(dir) {
  const els = [...document.querySelectorAll('[data-nav]')];
  if (!focused || !document.contains(focused)) return focus(els[0]);
  const a = focused.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best, bestScore = Infinity;
  for (const el of els) {
    if (el === focused) continue;
    const b = el.getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2;
    const dx = bx - ax, dy = by - ay;
    const main = { left:-dx, right:dx, up:-dy, down:dy }[dir];
    if (main <= 1) continue;
    const cross = dir === 'left' || dir === 'right' ? Math.abs(dy) : Math.abs(dx);
    const score = main + cross * 2.5;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) focus(best);
}

document.addEventListener('keydown', ev => {
  const dir = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' }[ev.key];
  const inInput = focused?.tagName === 'INPUT';
  if (dir) {
    // Left/right edit text inside the search box until the caret hits an edge
    if (inInput && (dir === 'left' || dir === 'right')) {
      const i = focused, atStart = i.selectionStart === 0, atEnd = i.selectionEnd === i.value.length;
      if ((dir === 'left' && !atStart) || (dir === 'right' && !atEnd)) return;
    }
    ev.preventDefault(); move(dir); return;
  }
  if (ev.key === 'Enter' || ev.keyCode === 23) {
    if (inInput) {
      // OK opens the keyboard; the keyboard's search key jumps to the results
      if (ev.isComposing) return;
      clearTimeout(searchTimer);
      runSearch(focused.value).then(() => { const c = document.querySelector('.card'); if (c) { focused.blur(); focus(c); } });
      return;
    }
    ev.preventDefault(); focused?.click();
  }
});
// Mouse/cursor clicks keep the focus ring in sync
document.addEventListener('focusin', ev => { if (ev.target.matches('[data-nav]')) focus(ev.target); });

route(history.state);
</script>
</body>
</html>
