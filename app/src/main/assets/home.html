<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Beam</title>
<style>
  :root { --bg:#0e1621; --panel:#18263a; --text:#e8eef6; --dim:#8a9bb3; --accent:#f7c55c; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; }
  body { padding:40px 56px 80px; overflow-x:hidden; }
  h2 { font-size:22px; color:var(--dim); font-weight:600; margin:32px 0 14px; }
  .top { display:flex; align-items:center; gap:20px; }
  .logo { height:60px; margin:0 -24px; padding:0 12px; border-radius:12px; border:3px solid transparent; box-sizing:content-box; }
  .logo.focus { border-color:var(--accent); }
  .ids { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .chip { font-size:13px; padding:4px 10px; border-radius:999px; background:#223349; color:var(--dim); }
  .chip b { color:var(--text); font-weight:600; }
  .ep .chips { display:flex; gap:6px; margin-top:8px; }
  .ep .chips .chip { font-size:11px; padding:2px 8px; }
  #q { flex:1; font-size:26px; padding:16px 22px; border-radius:12px; border:3px solid transparent;
       background:var(--panel); color:var(--text); outline:none; }
  #q::placeholder { color:var(--dim); }
  #q.focus { border-color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(6, 1fr); gap:22px; }
  h2 + .row { margin-top:8px !important; }
  .row { display:flex; gap:22px; overflow-x:auto; overflow-y:visible; padding:20px 24px 28px; margin:-20px -24px 0; scrollbar-width:none; }
  .row::-webkit-scrollbar { display:none; }
  .row .card { flex:0 0 calc((100% - 5 * 22px) / 6.3); }
  .card { position:relative; background:var(--panel); border-radius:12px; overflow:hidden; border:3px solid transparent; }
  .card img, .card .noimg { width:100%; aspect-ratio:2/3; object-fit:cover; display:block; background:#223349; }
  .card .meta { padding:10px 12px 12px; }
  .card .t { font-size:16px; font-weight:600; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2;
             -webkit-box-orient:vertical; overflow:hidden; }
  .card .s { font-size:13px; color:var(--dim); margin-top:4px; }
  .badges { position:absolute; top:8px; left:8px; right:8px; display:flex; flex-wrap:wrap; gap:5px; pointer-events:none; }
  .badge { font-size:11px; font-weight:600; padding:4px 9px; border-radius:999px; background:rgba(8,13,20,.92);
    color:#fff; box-shadow:0 1px 6px rgba(0,0,0,.6); display:flex; align-items:center; gap:6px; }
  .msg { color:var(--dim); font-size:20px; padding:20px 0; }

  .show-head { display:flex; gap:32px; align-items:flex-start; }
  .show-head img { width:200px; border-radius:12px; }
  .show-head h1 { margin:0 0 10px; font-size:38px; }
  .show-head p { color:var(--dim); font-size:17px; line-height:1.5; max-width:820px; margin:0; }
  .seasons { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
  .pill { padding:10px 20px; border-radius:999px; background:var(--panel); font-size:18px; border:3px solid transparent; }
  .pill.on { background:var(--accent); color:#111; }
  .eps { display:grid; grid-template-columns:repeat(4, 1fr); gap:20px; margin-top:24px; }
  .ep { background:var(--panel); border-radius:12px; overflow:hidden; border:3px solid transparent; }
  .ep img, .ep .noimg { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#223349; }
  .ep .meta { padding:10px 12px; }
  .ep .n { color:var(--accent); font-size:14px; font-weight:700; }
  .ep .t { font-size:16px; margin-top:2px; }
  .ep.last .n::after { content:"  ·  last watched"; color:var(--dim); font-weight:400; }
  .ep.soon img, .ep.soon .noimg { filter:grayscale(1) brightness(.45); }
  .ep.soon .n { color:var(--dim); }
  .ep .airs { color:var(--accent); background:rgba(247,197,92,.15); }

  /* Selected item: yellow outline + glow, lifted, everything else in its group dimmed. */
  .card, .ep, .pill { transition:transform .12s, opacity .12s, box-shadow .12s; }
  .card.focus, .ep.focus, .pill.focus { border-color:var(--accent); opacity:1;
    box-shadow:0 0 0 3px var(--accent), 0 0 28px rgba(247,197,92,.55); position:relative; z-index:1; }
  .card.focus, .ep.focus { transform:scale(1.08); }
  .pill.focus { transform:scale(1.1); }
  .grid:has(.focus) .card:not(.focus), .row:has(.focus) .card:not(.focus), .eps:has(.focus) .ep:not(.focus) { opacity:.55; }
  .ep.focus .t, .card.focus .t { color:#fff; }
  .card.moving { border-color:#fff; box-shadow:0 0 0 3px #fff, 0 0 28px rgba(255,255,255,.5); }
  .card.moving .s::before { content:"◀ ▶ move · OK done  "; color:#fff; }

  .modal { position:fixed; inset:0; background:rgba(5,10,18,.75); display:flex; align-items:center; justify-content:center; z-index:10; }
  .modal .box { background:var(--panel); border-radius:16px; padding:28px; min-width:420px; }
  .modal h3 { margin:0 0 18px; font-size:22px; }
  .modal .opt { font-size:20px; padding:14px 18px; border-radius:10px; border:3px solid transparent; margin-top:8px; }
  .modal .opt.focus { border-color:var(--accent); background:#223349; }
  /* Player: full-screen iframe, bar floats on top and hides once you're watching */
  .player { position:fixed; inset:0; background:#000; z-index:20; }
  .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .player .bar { position:absolute; top:0; left:0; right:0; height:64px; display:flex; align-items:center; gap:10px;
    padding:0 20px; background:linear-gradient(rgba(14,22,33,.95), rgba(14,22,33,.7));
    transition:transform .25s, opacity .25s; }
  .player.hide-bar .bar { transform:translateY(-100%); opacity:0; pointer-events:none; }
  .player button { font:inherit; font-size:16px; color:var(--text); background:var(--panel); border:0; border-radius:8px; padding:8px 14px; }
  .player button.on { background:var(--accent); color:#111; font-weight:700; }
  .player .title { flex:1; font-size:18px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 8px; }
  .player .title span, .player .label { color:var(--dim); font-weight:400; }
  .player .label { font-size:14px; }
  .srcs { display:flex; align-items:center; gap:10px; }
  .srcs .label { color:var(--dim); font-size:15px; margin-right:2px; }
  .srcs .pill { font-size:16px; padding:9px 16px; }
  .hint { position:fixed; bottom:12px; right:20px; color:var(--dim); font-size:14px; background:var(--bg); padding:6px 12px; border-radius:8px; z-index:5; }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">Hold OK on a title for options · MENU = home · <span id="ver"></span></div>
<script src="common.js"></script>
<script>
const app = document.getElementById('app');
let items = {}; // card key -> item, for the cards currently on screen
const keyOf = it => `${it.type}:${it.id}`;

// ---------- recommendations ----------
// Seeds are the most recent things watched, weighted by recency. Each seed's TMDB recommendations
// score by position in that list; titles several seeds agree on get a boost, then a nudge by rating.
async function recommended(recents, watchlist = []) {
  const seen = new Set();
  const seeds = [...recents.slice(0, 6), ...watchlist.slice(0, 4)].filter(x => !seen.has(keyOf(x)) && seen.add(keyOf(x)));
  const cacheKey = seeds.map(keyOf).sort().join(',');
  const cached = store.read('recCache', null);
  if (cached && cached.key === cacheKey && Date.now() - cached.at < 6 * 3600e3) return cached.items;

  const watched = new Set([...recents, ...watchlist].map(keyOf));
  const lists = await Promise.all(seeds.map(s =>
    tmdb(`/${s.type}/${s.id}/recommendations`).then(r => r.results || [], () => [])));
  const pool = new Map();
  lists.forEach((list, i) => {
    const weight = 1 / (1 + i * 0.4);
    list.slice(0, 20).forEach((m, pos) => {
      const it = toItem(m, m.media_type || seeds[i].type);
      if (!it.poster || watched.has(keyOf(it))) return;
      const p = pool.get(keyOf(it)) || { it, score: 0, hits: 0 };
      p.score += weight * (1 - pos / 25);
      p.hits++;
      pool.set(keyOf(it), p);
    });
  });
  const result = [...pool.values()]
    .map(p => ({ it: p.it, score: p.score * (1 + 0.3 * (p.hits - 1)) * (0.6 + 0.4 * p.it.vote / 10) }))
    .sort((a, b) => b.score - a.score).slice(0, 20).map(p => p.it);
  store.write('recCache', { key: cacheKey, at: Date.now(), items: result });
  return result;
}

const airDate = d => new Date(d + 'T12:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

// Next unaired episode of each show you watch or saved, soonest first. Show lookups cached for 6h.
async function comingUp(list) {
  const shows = [...new Map(list.filter(x => x.type === 'tv').map(x => [x.id, x])).values()].slice(0, 15);
  const cache = store.read('showCache', {});
  const out = await Promise.all(shows.map(async it => {
    let c = cache[it.id];
    if (!c || Date.now() - c.at > 6 * 3600e3) {
      try { c = cache[it.id] = { at: Date.now(), next: (await tmdb(`/tv/${it.id}`)).next_episode_to_air || null }; }
      catch { return null; }
    }
    const n = c.next;
    if (!n?.air_date) return null;
    return { id: it.id, type: 'tv', title: it.title, poster: it.poster, s: n.season_number, e: n.episode_number,
             airs: airDate(n.air_date), when: n.air_date };
  }));
  store.write('showCache', cache);
  return out.filter(Boolean).sort((a, b) => a.when.localeCompare(b.when));
}

// A show in Continue watching that also shows up in Watchlist / Coming up gets a corner badge
function badgeRecents(soon = []) {
  const next = new Map(soon.map(x => [keyOf(x), x]));
  document.querySelectorAll('.card[data-row="recent"]').forEach(card => {
    const it = items[card.dataset.key] && { id: +card.dataset.key.split(':')[1], type: card.dataset.key.split(':')[0] };
    const b = [];
    const n = next.get(card.dataset.key);
    if (n) b.push(`<span class="badge next">New ep ${esc(n.airs)}</span>`);
    if (it && store.inWatchlist(it)) b.push('<span class="badge">Watchlist</span>');
    card.querySelector('.badges')?.remove();
    if (b.length) card.insertAdjacentHTML('beforeend', `<div class="badges">${b.join('')}</div>`);
  });
}

async function trending() {
  const r = await tmdb('/trending/all/week');
  return (r.results || []).filter(m => m.media_type === 'movie' || m.media_type === 'tv').map(m => toItem(m));
}

// Continue watching from older versions stored IMDb ids; look them up once.
async function migrateRecents() {
  const r = store.recents;
  if (!r.some(x => String(x.id).startsWith('tt'))) return;
  const out = await Promise.all(r.map(async x => {
    if (!String(x.id).startsWith('tt')) return x;
    try {
      const f = await tmdb(`/find/${x.id}`, { external_source: 'imdb_id' });
      const m = f.movie_results?.[0] || f.tv_results?.[0];
      if (!m) return null;
      return { ...toItem(m, f.movie_results?.[0] ? 'movie' : 'tv'), s: x.s, e: x.e };
    } catch { return x; }
  }));
  store.recents = out.filter(Boolean);
}

// ---------- rendering ----------
function cardHtml(it, opts = {}) {
  items[keyOf(it)] = it;
  const kind = it.type === 'tv' ? 'Series' : 'Movie';
  const sub = it.airs ? `S${it.s} E${it.e} · ${it.airs}`
    : [kind, it.year, it.s ? `S${it.s} E${it.e}` : ''].filter(Boolean).join(' · ');
  return `<div class="card" data-nav data-key="${keyOf(it)}" ${opts.row ? `data-row="${opts.row}"` : ''}>
    ${it.poster ? `<img src="${esc(it.poster)}" loading="lazy">` : '<div class="noimg"></div>'}
    <div class="meta"><div class="t">${esc(it.title)}</div><div class="s">${esc(sub)}</div></div></div>`;
}

function rowHtml(title, list, opts) {
  return list.length ? `<h2>${title}</h2><div class="row">${list.map(it => cardHtml(it, opts)).join('')}</div>` : '';
}

const sourcePills = () => SOURCES.map(x =>
  `<div class="pill ${x.id === store.source ? 'on' : ''}" data-nav data-source="${x.id}">${x.name}</div>`).join('');

let searchTimer, searchSeq = 0;
function renderHome(q = '', focusKey) {
  items = {};
  app.innerHTML = `
    <div class="top"><img class="logo" data-nav data-side data-home src="logo.png" alt="Beam">
      <input id="q" data-nav placeholder="Search movies & shows…" value="${esc(q)}" autocomplete="off" enterkeyhint="search">
      <div class="srcs"><span class="label">Source</span>${sourcePills()}</div></div>
    <div id="results"></div>`;
  const input = document.getElementById('q');
  input.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => runSearch(input.value), 300); });
  return runSearch(q, true, focusKey);
}

async function runSearch(q, initial, focusKey) {
  q = q.trim();
  history.replaceState({ view: 'home', q }, '', location.search + '#');
  const box = document.getElementById('results');
  const seq = ++searchSeq;
  if (!KEY) { box.innerHTML = `<div class="msg">No TMDB key. Add <b>tmdb.key=…</b> to local.properties and rebuild.</div>`; return; }

  if (!q) {
    const recents = store.recents;
    box.innerHTML = rowHtml('Continue watching', recents, { row: 'recent' })
      + rowHtml('Watchlist', store.watchlist, { row: 'watch' }) + '<div id="more"></div>';
    badgeRecents();
    if (initial) focus(byKey(...(focusKey || '').split('|')) || document.querySelector('.card') || document.getElementById('q'));
    const [recs, trend, soon] = await Promise.all([
      recents.length || store.watchlist.length ? recommended(recents, store.watchlist).catch(() => []) : [],
      trending().catch(() => []),
      comingUp([...recents, ...store.watchlist]).catch(() => []),
    ]);
    if (seq !== searchSeq) return;
    const watched = new Set([...recents, ...store.watchlist].map(keyOf));
    document.getElementById('more').innerHTML =
      rowHtml('Recommended for you', recs) + rowHtml('Trending this week', trend.filter(t => !watched.has(keyOf(t))))
      + rowHtml('Coming up', soon);
    badgeRecents(soon);
    if (initial && !document.querySelector('.card.focus') && !document.querySelector('.card[data-row]')) focus(document.querySelector('.card'));
    return;
  }
  try {
    const r = await tmdb('/search/multi', { query: q, include_adult: 'false' });
    if (seq !== searchSeq) return;
    const res = (r.results || []).filter(m => m.media_type === 'movie' || m.media_type === 'tv').map(m => toItem(m));
    box.innerHTML = res.length ? `<h2>Results</h2><div class="grid">${res.map(it => cardHtml(it)).join('')}</div>`
                               : `<div class="msg">Nothing found for “${esc(q)}”.</div>`;
  } catch (err) {
    if (seq === searchSeq) box.innerHTML = `<div class="msg">Search failed: ${esc(err.message)}</div>`;
  }
  if (initial) focus(document.querySelector('.card') || document.getElementById('q'));
}

const byKey = (k, row) => k && document.querySelector(`.card[data-key="${k}"]${row ? `[data-row="${row}"]` : ''}`);
const focusKey = () => focused?.dataset?.key && `${focused.dataset.key}|${focused.dataset.row || ''}`;

async function renderShow(item, season) {
  items = {};
  app.innerHTML = `<div class="msg">Loading ${esc(item.title)}…</div>`;
  let show;
  try { show = await tmdb(`/tv/${item.id}`); }
  catch (err) { app.innerHTML = `<div class="msg">Couldn't load ${esc(item.title)}: ${esc(err.message)}</div>`; return; }
  const seasons = (show.seasons || []).filter(x => x.season_number > 0 && x.episode_count > 0).map(x => x.season_number);
  const last = store.recents.find(x => x.type === 'tv' && x.id === item.id);
  season = season || last?.s || seasons[0] || 1;

  const imdb = await imdbId(item);
  const idFor = src => src.imdb && imdb ? ['IMDb', imdb] : ['TMDB', item.id];
  let eps = [];
  try { eps = (await tmdb(`/tv/${item.id}/season/${season}`)).episodes || []; } catch {}
  const today = new Date().toISOString().slice(0, 10);
  const aired = ep => ep.air_date && ep.air_date <= today;

  app.innerHTML = `
    <div class="show-head">
      ${item.poster ? `<img src="${esc(item.poster)}">` : ''}
      <div><h1>${esc(show.name)}</h1><p>${esc(show.overview || '')}</p>
        <div class="srcs" style="margin-top:20px">
          <div class="pill" data-nav data-watch>${store.inWatchlist(item) ? '✓ In watchlist' : '＋ Watchlist'}</div>
          <span class="label" style="margin-left:14px">Source</span>${sourcePills()}</div>
        <div class="ids">${SOURCES.map(x => { const [k, v] = idFor(x); return `<span class="chip">${x.name} → <b>${k}</b> ${v}</span>`; }).join('')}</div></div>
    </div>
    <div class="seasons">${seasons.map(s => `<div class="pill ${s === season ? 'on' : ''}" data-nav data-season="${s}">Season ${s}</div>`).join('')}</div>
    <div class="eps">${eps.length ? eps.map(ep => `
      <div class="ep ${last?.s === season && last?.e === ep.episode_number ? 'last' : ''} ${aired(ep) ? '' : 'soon'}" data-nav data-e="${ep.episode_number}">
        ${ep.still_path ? `<img src="${img(ep.still_path, 'w300')}" loading="lazy">` : '<div class="noimg"></div>'}
        <div class="meta"><div class="n">E${ep.episode_number}</div><div class="t">${esc(ep.name || 'Episode ' + ep.episode_number)}</div>
          <div class="chips"><span class="chip">TMDB</span>${imdb ? '<span class="chip">IMDb</span>' : ''}${aired(ep) ? `<span class="chip">${esc(ep.air_date)}</span>` : `<span class="chip airs">${ep.air_date ? 'Airs ' + airDate(ep.air_date) : 'Date TBA'}</span>`}</div></div>
      </div>`).join('') : '<div class="msg">No episodes listed for this season yet.</div>'}</div>`;

  app.onclick = ev => {
    const w = ev.target.closest('[data-watch]');
    if (w) { store.toggleWatchlist(item); w.textContent = store.inWatchlist(item) ? '✓ In watchlist' : '＋ Watchlist'; return; }
    const p = ev.target.closest('[data-season]');
    if (p) { renderShow(item, +p.dataset.season).then(() => focus(document.querySelector('.pill.on'))); return; }
    const ep = ev.target.closest('[data-e]');
    if (ep && !ep.classList.contains('soon')) play(item, season, +ep.dataset.e);
  };
  focus(document.querySelector('.ep.last') || document.querySelector('.ep') || document.querySelector('.pill'));
}

function play(item, s, e) {
  store.touch({ ...item, s, e });
  openPlayer(item, s, e);
}

// ---------- player overlay ----------
// Lives inside this page so BACK just closes it, rather than stepping back through the embed's history.
let player = null, barTimer;

function openPlayer(item, s, e) {
  closePlayer();
  player = document.createElement('div');
  player.className = 'player';
  player.innerHTML = `<div class="bar">
      <button data-act="back">‹ Back</button>
      <div class="title">${esc(item.title)}${item.type === 'tv' ? ` <span>· S${s} E${e}</span>` : ''}</div>
      <span class="label">Source</span>
      ${SOURCES.map(x => `<button data-src="${x.id}">${x.name}</button>`).join(' ')}
      <button data-act="next" hidden>Next episode ›</button>
    </div>`;
  player.onclick = ev => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.src) loadSource(item, s, e, b.dataset.src);
    else if (b.dataset.act === 'back') { closePlayer(); refreshAfterPlayer(); }
    else if (b.dataset.act === 'next') b.onNext?.();
  };
  document.body.appendChild(player);
  window.Native?.setPlayerMode(true);
  loadSource(item, s, e, store.source);
  showBar(4000);
  if (item.type === 'tv') nextEpisode(item, s, e).then(n => {
    const btn = player?.querySelector('[data-act="next"]');
    if (!n || !btn) return;
    btn.hidden = false;
    btn.onNext = () => play({ ...item, s: n[0], e: n[1] }, n[0], n[1]);
  }).catch(() => {});
}

async function loadSource(item, s, e, srcId) {
  const src = SOURCES.find(x => x.id === srcId) || SOURCES[0];
  store.source = src.id;
  player.querySelectorAll('[data-src]').forEach(b => b.classList.toggle('on', b.dataset.src === src.id));
  const id = (src.imdb && await imdbId(item)) || item.id;
  if (!player) return;
  // A fresh iframe per source, so switching never piles up history entries
  player.querySelector('iframe')?.remove();
  const frame = document.createElement('iframe');
  frame.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
  frame.allowFullscreen = true;
  frame.referrerPolicy = 'origin';
  frame.src = item.type === 'tv' ? src.tv(id, s, e) : src.movie(id);
  player.prepend(frame);
}

function closePlayer() {
  if (!player) return;
  player.remove();
  player = null;
  clearTimeout(barTimer);
  window.Native?.setPlayerMode(false);
}

// Coming back from the player: redraw so Continue watching / last watched are current
function refreshAfterPlayer() {
  const st = history.state;
  if (st?.view === 'show') renderShow(st.item);
  else renderHome(st?.q || '', focusKey());
}

// Bar shows on open and when the cursor/mouse goes near the top; hides once you click into the video
function showBar(ms) {
  if (!player) return;
  player.classList.remove('hide-bar');
  clearTimeout(barTimer);
  if (ms) barTimer = setTimeout(() => player?.classList.add('hide-bar'), ms);
}
// Any D-pad press in the player (the app reports cursor moves) brings the bar back for a few seconds
window.onCursor = () => showBar(3000);
document.addEventListener('mousemove', () => player && onCursor());
window.addEventListener('blur', () => setTimeout(() => {
  if (player && document.activeElement?.tagName === 'IFRAME') { clearTimeout(barTimer); player.classList.add('hide-bar'); }
}));

// Rest of this season, else episode 1 of the next season
async function nextEpisode(item, s, e) {
  const today = new Date().toISOString().slice(0, 10);
  const season = await tmdb(`/tv/${item.id}/season/${s}`);
  if ((season.episodes || []).some(ep => ep.episode_number === e + 1 && ep.air_date && ep.air_date <= today)) return [s, e + 1];
  const show = await tmdb(`/tv/${item.id}`);
  const next = (show.seasons || []).find(x => x.season_number === s + 1 && x.episode_count > 0);
  return next && next.air_date && next.air_date <= today ? [s + 1, 1] : null;
}

function openItem(it) {
  if (it.type === 'tv') {
    history.pushState({ view: 'show', item: it }, '', location.search + '#show');
    renderShow(it);
  } else play(it);
}

app.addEventListener('click', ev => {
  if (ev.target.closest('[data-home]')) { renderHome(''); return; }
  const src = ev.target.closest('[data-source]');
  if (src) {
    store.source = src.dataset.source;
    document.querySelectorAll('[data-source]').forEach(p => p.classList.toggle('on', p === src));
    return;
  }
  const c = ev.target.closest('.card');
  if (c && items[c.dataset.key] && !moving) openItem(items[c.dataset.key]);
});

window.addEventListener('popstate', ev => route(ev.state));
function route(st) {
  app.onclick = null;
  if (st?.view === 'show') renderShow(st.item);
  else renderHome(st?.q || '');
}

// ---------- Hold OK on a poster: watchlist, and Move / Remove in your own rows ----------
const LISTS = { recent: { store: 'recents', name: 'Continue watching' }, watch: { store: 'watchlist', name: 'Watchlist' } };
let modal = null, moving = null, modalFrom = null; // moving = { key, row }

window.onLongPress = () => {
  if (modal || moving || !focused?.matches('.card')) return;
  const key = focused.dataset.key, row = focused.dataset.row, it = items[key];
  modalFrom = { key, row };
  const opts = [];
  if (row) opts.push(['move', 'Move'], ['remove', `Remove from ${LISTS[row].name}`]);
  if (row !== 'watch') opts.push(['watch', store.inWatchlist(it) ? 'Remove from Watchlist' : 'Add to Watchlist']);
  opts.push(['cancel', 'Cancel']);
  modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `<div class="box"><h3>${esc(it.title)}</h3>
    ${opts.map(([act, label]) => `<div class="opt" data-nav data-act="${act}">${label}</div>`).join('')}</div>`;
  modal.onclick = ev => {
    const act = ev.target.closest('[data-act]')?.dataset.act;
    if (!act) return;
    closeModal();
    if (act === 'remove') {
      const list = store[LISTS[row].store], i = list.findIndex(x => keyOf(x) === key);
      store[LISTS[row].store] = list.filter(x => keyOf(x) !== key);
      const next = list[i + 1] || list[i - 1];
      renderHome('', next ? `${keyOf(next)}|${row}` : '');
    } else if (act === 'watch') {
      store.toggleWatchlist(it);
      if (history.state?.view !== 'show' && !document.getElementById('q')?.value) renderHome('', `${key}|${row || ''}`);
    } else if (act === 'move') {
      moving = { key, row };
      focus(byKey(key, row));
      focused.classList.add('moving');
    }
  };
  document.body.appendChild(modal);
  focus(modal.querySelector('.opt'));
};

function closeModal() {
  modal?.remove(); modal = null;
  focus(byKey(modalFrom.key, modalFrom.row));
}

function moveCard(dir) {
  const name = LISTS[moving.row].store;
  const list = store[name], i = list.findIndex(x => keyOf(x) === moving.key), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  store[name] = list;
  // Swap the two cards in place rather than re-rendering the whole page
  const a = byKey(moving.key, moving.row), b = byKey(keyOf(list[i]), moving.row);
  dir > 0 ? b.after(a) : b.before(a);
  a.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
}

function stopMoving() {
  byKey(moving.key, moving.row)?.classList.remove('moving');
  moving = null;
}

// Native BACK asks here first; true means it was handled
window.onBack = () => {
  if (player) { closePlayer(); refreshAfterPlayer(); return true; }
  if (modal) { closeModal(); return true; }
  if (moving) { stopMoving(); return true; }
  // BACK with a search typed clears it instead of leaving
  const q = document.getElementById('q');
  if (q?.value && history.state?.view !== 'show') { renderHome('', q === focused ? null : focusKey()); return true; }
  return false;
};

// ---------- D-pad spatial navigation ----------
let focused = null;
function focus(el) {
  if (!el) return;
  focused?.classList.remove('focus');
  focused = el; el.classList.add('focus');
  if (el.tagName === 'INPUT') el.focus({ preventScroll: true }); else document.activeElement?.blur();
  el.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
}

function move(dir) {
  const scope = modal || document;
  const els = [...scope.querySelectorAll('[data-nav]')];
  if (!focused || !document.contains(focused) || !scope.contains(focused)) return focus(els[0]);
  const a = focused.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best, bestScore = Infinity;
  for (const el of els) {
    if (el === focused) continue;
    const b = el.getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2;
    const dx = bx - ax, dy = by - ay;
    const main = { left: -dx, right: dx, up: -dy, down: dy }[dir];
    if (main <= 1) continue;
    if (el.hasAttribute('data-side') && (dir === 'up' || dir === 'down')) continue;
    const cross = dir === 'left' || dir === 'right' ? Math.abs(dy) : Math.abs(dx);
    // Up/down between rows lands near the same horizontal spot, not on whatever is closest overall
    const score = main + cross * (dir === 'up' || dir === 'down' ? 1.2 : 2.5);
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) focus(best);
}

// OK clicks on release so holding it can open the menu instead. In the app the native side does
// the long-press detection and calls onLongPress(); in a desktop browser held keys repeat.
let okArmed = false, okLong = false;
document.addEventListener('keydown', ev => {
  const dir = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[ev.key];
  const inInput = focused?.tagName === 'INPUT';
  if (ev.key === 'Escape') { ev.preventDefault(); if (!onBack()) history.back(); return; }
  if (player) return;
  if (dir) {
    if (moving) { ev.preventDefault(); if (dir === 'left' || dir === 'right') moveCard(dir === 'left' ? -1 : 1); return; }
    // Left/right edit text inside the search box until the caret hits an edge
    if (inInput && (dir === 'left' || dir === 'right')) {
      const i = focused, atStart = i.selectionStart === 0, atEnd = i.selectionEnd === i.value.length;
      if ((dir === 'left' && !atStart) || (dir === 'right' && !atEnd)) return;
    }
    ev.preventDefault(); move(dir); return;
  }
  if (ev.key === 'Enter' || ev.keyCode === 23) {
    if (inInput) {
      // OK opens the keyboard; the keyboard's search key jumps to the results
      if (ev.isComposing) return;
      clearTimeout(searchTimer);
      runSearch(focused.value).then(() => { const c = document.querySelector('.card'); if (c) { focused.blur(); focus(c); } });
      return;
    }
    ev.preventDefault();
    if (!ev.repeat) { okArmed = true; okLong = false; }
    else if (okArmed && !okLong) { okLong = true; onLongPress(); }
  }
});
document.addEventListener('keyup', ev => {
  if (player) return;
  if ((ev.key === 'Enter' || ev.keyCode === 23) && okArmed) {
    okArmed = false;
    if (okLong) return;
    if (moving) stopMoving(); else focused?.click();
  }
});
// Mouse clicks (browser preview) keep the focus ring in sync
document.addEventListener('focusin', ev => { if (ev.target.matches('[data-nav]')) focus(ev.target); });

document.getElementById('ver').textContent = 'v' + (new URLSearchParams(location.search).get('v') || 'dev');
migrateRecents().catch(() => {}).then(() => route(history.state));
</script>
</body>
</html>
